<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: transparent;
      -webkit-user-select: none; user-select: none;
    }
    #root { position: absolute; inset: 0; }
    .widget { position: absolute; top: 0; left: 0; pointer-events: none; }
    .widget-body { width: 100%; height: 100%; }

    /* Grid overlay: visible only while editing with snap-to-grid enabled. */
    body.edit.snap::before {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      --grid: 17px; /* overridden at runtime to the widget grid step */
      background-image:
        linear-gradient(to right, rgba(140, 140, 140, 0.18) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(140, 140, 140, 0.18) 1px, transparent 1px);
      background-size: var(--grid) var(--grid);
    }

    /* Edit mode (picker drawer open): instances are draggable + removable. */
    body.edit .widget { pointer-events: auto; cursor: grab; }
    body.edit .widget.dragging { cursor: grabbing; }
    body.edit .widget:hover {
      outline: 1.5px dashed rgba(140, 140, 140, 0.6);
      outline-offset: 5px;
    }
    .bruma-remove {
      position: absolute; top: -10px; left: -10px;
      width: 24px; height: 24px; border-radius: 50%;
      background: rgba(72, 72, 74, 0.95); color: #fff;
      display: none; align-items: center; justify-content: center;
      font: 600 17px/1 -apple-system, sans-serif;
      cursor: pointer; z-index: 10;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45),
                  inset 0 0 0 0.5px rgba(255, 255, 255, 0.25);
    }
    .bruma-remove:hover { background: rgba(255, 59, 48, 0.95); }
    body.edit .widget .bruma-remove { display: flex; }

    /* Anchor badge: the nine anchor points as a 3×3 grid. The lit cell is the
       point the saved position refers to — the one that stays put when the
       widget's content grows or shrinks. */
    .bruma-anchor {
      position: absolute; top: -10px; right: -10px;
      display: none; grid-template-columns: repeat(3, 7px);
      grid-template-rows: repeat(3, 7px); gap: 2px;
      padding: 5px; border-radius: 9px;
      background: rgba(72, 72, 74, 0.95); z-index: 10;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45),
                  inset 0 0 0 0.5px rgba(255, 255, 255, 0.25);
    }
    .bruma-anchor-cell {
      border-radius: 2px; cursor: pointer;
      background: rgba(255, 255, 255, 0.28);
    }
    .bruma-anchor-cell:hover { background: rgba(255, 255, 255, 0.65); }
    .bruma-anchor-cell.on { background: #0a84ff; }
    body.edit .widget .bruma-anchor { display: grid; }
  </style>
  <script src="vendor/react.min.js"></script>
  <script src="vendor/react-dom.min.js"></script>
  <script src="vendor/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script src="runtime.js"></script>
</body>
</html>
