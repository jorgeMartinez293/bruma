<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: transparent;
      -webkit-user-select: none; user-select: none;
      font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
      --fg: rgba(0, 0, 0, 0.85);
      --fg-dim: rgba(0, 0, 0, 0.5);
      --card: rgba(0, 0, 0, 0.06);
      --card-hover: rgba(0, 0, 0, 0.10);
      --glassbg: rgba(255, 255, 255, 0.55);
    }
    @media (prefers-color-scheme: dark) {
      html {
        --fg: rgba(255, 255, 255, 0.9);
        --fg-dim: rgba(255, 255, 255, 0.5);
        --card: rgba(255, 255, 255, 0.07);
        --card-hover: rgba(255, 255, 255, 0.12);
        --glassbg: rgba(80, 80, 85, 0.45);
      }
    }

    header {
      display: flex; align-items: center;
      padding: 16px 22px 6px;
    }
    header h1 {
      margin: 0; font-size: 17px; font-weight: 700; color: var(--fg);
    }
    header .hint { margin-left: 12px; font-size: 12px; color: var(--fg-dim); }
    header .close {
      margin-left: auto;
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--card); color: var(--fg-dim);
      font-size: 15px; cursor: pointer;
    }
    header .close:hover { background: var(--card-hover); color: var(--fg); }

    #cards {
      display: flex; gap: 14px;
      padding: 10px 22px 18px;
      overflow-x: auto; overflow-y: hidden;
      height: 196px; box-sizing: border-box;
      align-items: stretch;
    }
    #cards::-webkit-scrollbar { height: 0; }

    .card {
      flex: 0 0 auto;
      width: 220px;
      border-radius: 16px;
      background: var(--card);
      cursor: pointer;
      display: flex; flex-direction: column;
      overflow: hidden;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .card:hover { background: var(--card-hover); transform: translateY(-2px); }
    .card:active { transform: scale(0.97); }
    .card.added { animation: pop 0.35s ease; }
    @keyframes pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    .stage {
      position: relative;
      flex: 1;
      overflow: hidden;
    }
    /* Preview wrapper: the widget's own className is scoped to this node;
       picker.js re-centres + scales it to fit the stage. */
    .pv { position: absolute; }
    .pv.preview-glass { background: var(--glassbg); }
    .pv * { pointer-events: none; }

    .name {
      padding: 8px 12px 10px;
      font-size: 12.5px; font-weight: 600; color: var(--fg);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-align: center;
    }
    .empty {
      align-self: center; margin: auto;
      color: var(--fg-dim); font-size: 13px;
    }
  </style>
  <script src="vendor/react.min.js"></script>
  <script src="vendor/react-dom.min.js"></script>
  <script src="vendor/babel.min.js"></script>
</head>
<body>
  <header>
    <h1>Widgets</h1>
    <span class="hint">Haz clic para añadir · arrastra los widgets del escritorio para moverlos</span>
    <div class="close" id="close" title="Cerrar">✕</div>
  </header>
  <div id="cards"></div>
  <script src="picker.js"></script>
</body>
</html>
